[project]
name = "pythondaq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maarten van Bokhorst", email = "maarten.van.bokhorst@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyserial>=3.5",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.8.1",
    "serial>=0.0.97",
]

[project.scripts]
pythondaq = "pythondaq:main"
easystat = "easystat:main"
commando = "pythondaq.run_experiment:main"


[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
